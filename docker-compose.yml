version: "3.9"

networks:
  food-net:
    driver: bridge

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks: [food-net]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    networks: [food-net]
    ports: ["3001:3001"]
    env_file: ./services/user-service/.env
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  restaurant-service:
    build: ./services/restaurant-service
    restart: unless-stopped
    networks: [food-net]
    ports: ["3002:3002"]
    env_file: ./services/restaurant-service/.env
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    networks: [food-net]
    ports: ["3003:3003"]
    env_file: ./services/order-service/.env
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  delivery-service:
    build: ./services/delivery-service
    restart: unless-stopped
    networks: [food-net]
    ports: ["3004:3004"]
    env_file: ./services/delivery-service/.env
    depends_on:
      mongo:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [food-net]
    ports: ["3000:3000"]
    env_file: ./frontend/.env
    depends_on:
      - order-service
      - restaurant-service
      - user-service
      - delivery-service

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: [food-net]
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - restaurant-service
      - order-service
      - delivery-service
      - frontend

volumes:
  mongo-data:
